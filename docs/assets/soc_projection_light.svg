<svg xmlns="http://www.w3.org/2000/svg" width="800" height="816" viewBox="0 0 800 816" role="img" aria-labelledby="t d">
<title id="t">Projected state of charge for activations from 10:00, 10:15 and 10:30</title>
<desc id="d">Each activation draws FCR for 30 minutes and aFRR for 60 minutes from its start. The lowest projected state of charge of each path is reached at 11:00: 490, 622 and 753 kWh, against soc_min 400 kWh.</desc>
