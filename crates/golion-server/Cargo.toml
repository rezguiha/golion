[package]
name = "golion-server"
version = "0.0.0"
edition = "2024"

[dependencies]
# -- Web
axum = "0.8.9"
axum-valid = { version = "0.25", default-features = false, features = [
    "garde",
    "basic",
] }
# -- Async
tokio = { version = "1", features = ["full"] }
# -- Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# -- Serialization
serde = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }
# -- Workspace
golion-contract = { workspace = true }
golion-domain = { workspace = true }
golion-optimization = { workspace = true }
# --Others
derive_more = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
anyhow = "1"
httpc-test = "0.1.10"

[lints]
workspace = true
