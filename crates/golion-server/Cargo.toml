[package]
name = "golion-server"
version = "0.0.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-valid = { version = "0.25", default-features = false, features = [
    "garde",
    "basic",
] }
derive_more = { workspace = true }
