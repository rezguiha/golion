[package]
name = "lib-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
# -- Async
tokio = { version = "1", features = ["full"] }
# -- Database querying
sqlx = { version = "0.9", features = [ "macros", "runtime-tokio", "postgres", "uuid" ] }
modql = { version= "0.8" ,features=["with-sea-query"]}
sea-query = { version = "1.0",features=["backend-postgres"]}
sea-query-sqlx = { version = "0.9.1", features = ["sqlx-postgres"] }
# -- Logging
tracing = { workspace = true }
# -- Read Configuration
config = "0.15.27"
# -- Serialization
serde = { workspace = true }
# -- Others
derive_more = { workspace = true }


[dev-dependencies]
anyhow = { workspace = true }
serial_test="4"
[lints]
workspace = true
