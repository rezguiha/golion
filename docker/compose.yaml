name: golion
services:
  backend:
    build:
      context: ..
      dockerfile: docker/web-server/Dockerfile
    init: true
    environment:
      RUST_LOG: ${RUST_LOG}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - client-side
      - server-side
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ../crates
        - action: rebuild
          path: ../Cargo.toml
        - action: rebuild
          path: ../Cargo.lock
        - action: rebuild
          path: ../sql

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: welcome
    networks:
      - server-side
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  server-side: {}
  # Not necessary now waiting frontend implementation
  client-side: {}

volumes:
  db-data: {}
