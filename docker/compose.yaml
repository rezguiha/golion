name: golion
services:
  backend:
    build:
      context: ..
      dockerfile: docker/web-server/Dockerfile
    init: true
    environment:
      RUST_LOG: ${RUST_LOG}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - client-side
      - server-side
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ../crates
        - action: rebuild
          path: ../Cargo.toml
        - action: rebuild
          path: ../Cargo.lock

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
    networks:
      - server-side
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  server-side: {}
  # Not necessary now waiting frontend implementation
  client-side: {}

volumes:
  db-data: {}
