#:schema https://dystroy.org/bacon/.bacon.schema.json

# This is a configuration file for the bacon tool
#
# Complete help on configuration: https://dystroy.org/bacon/config/
#
# You may check the current default at
#   https://github.com/Canop/bacon/blob/main/defaults/default-bacon.toml

default_job = "clippy"
env.CARGO_TERM_COLOR = "always"

[jobs.check]
command = ["cargo", "check"]
need_stdout = false

[jobs.check-all]
command = ["cargo", "check"]
need_stdout = false

# Run clippy
[jobs.clippy]
command = ["cargo", "clippy","--all-targets","--all-features","--", "-D", "warnings"]
need_stdout = false


# Run clippy in pedantic mode
[jobs.pedantic]
command = [
	"cargo", "clippy","--all-targets","--all-features","--", "-D", "warnings", "--","-W", "clippy::pedantic",
]
need_stdout = false

# This job lets you run tests and doc examples for all crates but server for now.
[jobs.test]
command = ["cargo", "test","--workspace","--exclude","golion-server"]
need_stdout = true

[jobs.doc]
command = ["cargo", "doc", "--no-deps"]
need_stdout = false

# If the doc compiles, then it opens in your browser and bacon switches
# to the previous job
[jobs.doc-open]
command = ["cargo", "doc", "--no-deps", "--open"]
need_stdout = false
on_success = "back" # so that we don't open the browser at each change


# Runs the server.
[jobs.server]
command = ["cargo", "run"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
default_watch = false
watch = ["crates"]
scroll_anchor = "auto"

# Runs the test client.
[jobs.test-client]
command = [
    "cargo", "test",
    "--package", "golion-server",
    "--test", "quick_dev",
    "--", "--nocapture",
]
need_stdout = true
default_watch = false
watch = ["crates/golion-server/tests"]
