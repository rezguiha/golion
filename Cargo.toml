[workspace]
members = [
    # -- Application Libraries
    "crates/libs/lib-contract",
    "crates/libs/lib-core",
    "crates/libs/lib-domain",
    "crates/libs/lib-optimization",
    # -- Application Services
    "crates/services/web-server",
    ]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
authors = ["Hamdi Rezgui <hamdi.rezgui.pro@gmail.com>"]

[workspace.dependencies]
derive_more = { version = "2", features = ["full"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
jiff = "0.2.35"
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
[workspace.lints.rust]
# Temporarily disable dead code check as we are still
# in early stages of project.
dead_code = "allow"
